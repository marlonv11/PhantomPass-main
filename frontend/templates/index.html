<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PhantomPass</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header>
      <h1>PhantomPass</h1>
      <p>Dashboard de monitoreo de datos</p>
    </header>
    <main>
      <table>
        <thead>
          <tr><th>Título</th><th>URL</th></tr>
        </thead>
        <tbody>
          {% for r in records %}
          <tr>
            <td>{{ r.title }}</td>
            <td><a href="{{ r.url }}">{{ r.url }}</a></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </main>
  </body>
</html>
